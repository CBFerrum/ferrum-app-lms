- name: LmsSettings
  label: Learn Settings
  kind: settings
  module: learn
  fields:
    - {name: public_url, type: url, label: Public URL, description: "Address people reach this server at (e.g. https://erp.example.com); used for certificate verification links and in emails"}
    - {name: email_notifications, type: check, default: true, description: "Also email learners and instructors when the Mail app is installed (in-app notifications are always sent)"}
    - {name: session_reminder_minutes, type: int, label: Session Reminder (Minutes Before), default: 60, min: 5, max: 10080, description: "Cohort members and instructors are reminded once, this long before each live session"}
    - {name: certificate_issuer, type: data, max_length: 200, description: "Organization named on certificates (the workspace name when empty)"}
    - {name: certificate_signatory, type: data, max_length: 200, description: "Name printed under the signature line of certificates"}
    - {name: certificate_signatory_title, type: data, max_length: 200}
    - {name: video_hosts, type: text, label: Additional Video Hosts, max_length: 4000, description: "One host per line (e.g. video.example.com): https URLs on these hosts (and their subdomains) may be embedded as they are, besides YouTube, Vimeo, Loom, Wistia and Google Drive"}
    - {name: lti_private_key, type: secret, label: LTI Signing Key, description: "The private key Learn signs LTI launches with; made on first use. Replacing it means every tool fetches Learn's keys again"}
    - {name: due_reminder_days, type: int, label: Remind Before Due (Days), default: 3, min: 0, max: 365, description: "A learner is reminded once, this many days before an enrolment is due; 0 = never. A course can say its own"}
    - {name: overdue_reminder_days, type: int, label: Remind After Due (Days), default: 1, min: 0, max: 365, description: "A learner is reminded once, this many days after an enrolment fell due and is still not completed; 0 = never. A course can say its own"}
    - {name: recertify_before_days, type: int, label: Re-enrol Before Expiry (Days), default: 30, min: 0, max: 3650, description: "A learner whose certificate expires within this many days is enrolled again, due on the day it expires; 0 = never. A course can say its own"}
    - {name: allow_packages, type: check, label: Allow SCORM and xAPI Packages, description: "Instructors may make lessons of SCORM 1.2, SCORM 2004 and xAPI packages. A package's scripts run in Learn with the learner's session, as course content does in other LMSs: allow them only when you trust your instructors' packages"}

- name: LmsCategory
  label: Course Category
  label_plural: Course Categories
  kind: master
  module: learn
  title_field: category_name
  fields:
    - {name: category_name, type: data, required: true, unique: true, max_length: 140, in_list: true}
    - {name: description, type: text, max_length: 2000}
  list: {columns: [category_name], sort: category_name asc}

- name: LmsCourseInstructor
  label: Course Instructor
  kind: child
  fields:
    - {name: instructor, type: email, required: true, in_list: true, description: "Email address the instructor signs in with"}
    - {name: instructor_name, type: data, read_only: true, in_list: true}

- name: LmsCoursePrerequisite
  label: Course Prerequisite
  kind: child
  fields:
    - {name: course, type: link, to: LmsCourse, required: true, in_list: true}
    - {name: course_title, type: data, fetch_from: course.title, read_only: true, in_list: true}

- name: LmsCourse
  label: Course
  kind: master
  module: learn
  title_field: title
  search_fields: [slug, tags]
  owner_fields: [instructors.instructor]
  description: "A course: chapters of ordered lessons (articles, videos, documents, quizzes, assignments). Its instructors and LMS managers edit it; learners enrol once it is published."
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: slug, type: data, unique: true, max_length: 100, in_list: true, description: "Name in links: lower-case letters, digits and hyphens; made from the title when empty"}
    - {name: status, type: select, options: [Draft, Published, Archived], required: true, default: Draft, in_list: true, in_filter: true, description: "Learners enrol in published courses; archived courses take no new enrolments"}
    - {name: visibility, type: select, options: [Internal, Public], required: true, default: Internal, in_list: true, in_filter: true, description: "Public courses are also listed on the public catalog once published"}
    - {name: category, type: link, to: LmsCategory, in_list: true, in_filter: true}
    - {name: level, type: select, options: [Beginner, Intermediate, Advanced], required: true, default: Beginner, in_filter: true}
    - {name: tags, type: data, max_length: 300, description: "Comma-separated, e.g. safety, onboarding"}
    - {name: summary, type: text, max_length: 500}
    - {name: description, type: markdown, max_length: 100000}
    - {name: cover_image, type: attach, description: "Upload it as a public file for the public catalog"}
    - {name: instructors, type: table, of: LmsCourseInstructor, description: "Instructors edit the course and its lessons, quizzes and assignments, enrol learners and grade"}
    - {name: prerequisites, type: table, of: LmsCoursePrerequisite, description: "Courses a learner must have completed before enrolling themselves"}
    - {name: estimated_hours, type: decimal, precision: 2, min: "0", max: "10000"}
    - {name: self_enrollment, type: check, label: Learners May Enrol Themselves, default: true}
    - {name: issue_certificate, type: check, label: Certificate on Completion}
    - {name: certificate_valid_days, type: int, label: Certificate Valid (Days), min: 1, max: 36500, description: "How long a certificate issued for this course counts; empty: for ever"}
    - {name: recertify_before_days, type: int, label: Re-enrol Before Expiry (Days), min: 0, max: 3650, description: "Empty: as in Learn Settings; 0 = never re-enrol automatically"}
    - {name: due_days, type: int, label: Due (Days After Enrolment), min: 0, max: 3650, description: "An enrolment is due this many days after it is made; empty or 0 = no due date unless one is set"}
    - {name: due_reminder_days, type: int, label: Remind Before Due (Days), min: 0, max: 365, description: "Empty: as in Learn Settings; 0 = never"}
    - {name: overdue_reminder_days, type: int, label: Remind After Due (Days), min: 0, max: 365, description: "Empty: as in Learn Settings; 0 = never"}
    - {name: published_at, type: datetime, read_only: true, no_copy: true}
    - {name: lesson_count, type: int, label: Lessons, read_only: true, no_copy: true, in_list: true}
    - {name: total_minutes, type: int, label: Duration (Minutes), read_only: true, no_copy: true}
  form:
    - {label: Course, fields: [title, slug, status, visibility, category, level, tags, summary, cover_image]}
    - {label: Description, fields: [description]}
    - {label: Teaching, fields: [instructors, prerequisites, estimated_hours, self_enrollment, issue_certificate]}
    - {label: Deadlines, fields: [due_days, due_reminder_days, overdue_reminder_days, certificate_valid_days, recertify_before_days]}
    - {label: Statistics, collapsible: true, fields: [published_at, lesson_count, total_minutes]}
  actions:
    - name: enroll_learners
      label: Enrol Learners
      permission: write
      condition: "doc.status != 'Archived'"
      params:
        - {name: learners, type: text, label: Learners, required: true, description: "Their emails, one a line or separated by commas"}
        - {name: cohort, type: link, to: LmsCohort, label: Cohort, description: "Into this cohort of the course; none when empty"}
  list: {columns: [title, status, visibility, category, lesson_count], sort: title asc}

- name: LmsChapter
  label: Chapter
  kind: master
  module: learn
  title_field: title
  fields:
    - {name: course, type: link, to: LmsCourse, required: true, in_list: true, in_filter: true}
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: position, type: int, min: 0, max: 100000, in_list: true, description: "Order in the course; the next free position when empty"}
    - {name: summary, type: text, max_length: 2000}
  list: {columns: [title, course, position], sort: position asc}

- name: LmsLesson
  label: Lesson
  kind: master
  module: learn
  title_field: title
  unique: [[quiz], [assignment]]
  description: "A step of a course. Articles, videos and documents are completed by marking them done; quiz lessons when the quiz is passed; assignment lessons when the submission passes; SCORM and xAPI lessons when their package says completed or passed; LTI lessons when their tool sends a completed score (or the learner marks them done, when it sends none); live lessons when the learner attends the live session of a cohort that names the lesson."
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: chapter, type: link, to: LmsChapter, required: true, in_list: true, in_filter: true}
    - {name: course, type: link, to: LmsCourse, read_only: true, in_filter: true, description: "The chapter's course"}
    - {name: position, type: int, min: 0, max: 100000, in_list: true, description: "Order in the chapter; the next free position when empty"}
    - {name: lesson_type, type: select, label: Type, options: [Article, Video, Document, Quiz, Assignment, SCORM, xAPI, LTI, Live], required: true, default: Article, in_list: true, in_filter: true}
    - {name: content, type: markdown, max_length: 500000}
    - {name: video_url, type: url, label: Video URL, required_if: "doc.lesson_type == 'Video'", description: "https link on YouTube, Vimeo, Loom, Wistia, Google Drive or a host allowed in Learn Settings"}
    - {name: video_embed_url, type: url, label: Embed URL, read_only: true, no_copy: true}
    - {name: attachment, type: attach, label: File, required_if: "doc.lesson_type == 'Document'", description: "A PDF or other file uploaded with /api/files"}
    - {name: quiz, type: link, to: LmsQuiz, required_if: "doc.lesson_type == 'Quiz'", visible_if: "doc.lesson_type == 'Quiz'"}
    - {name: assignment, type: link, to: LmsAssignment, required_if: "doc.lesson_type == 'Assignment'", visible_if: "doc.lesson_type == 'Assignment'"}
    - {name: package_file, type: attach, label: Package, required_if: "doc.lesson_type == 'SCORM' || doc.lesson_type == 'xAPI'", visible_if: "doc.lesson_type == 'SCORM' || doc.lesson_type == 'xAPI'", description: "A SCORM 1.2, SCORM 2004 or xAPI (Tin Can) package (.zip, up to 256 MB) uploaded with /api/files"}
    - {name: package_standard, type: data, label: Standard, read_only: true, no_copy: true, visible_if: "doc.package_file != null", description: "SCORM 1.2, SCORM 2004 or xAPI, as the package says"}
    - {name: package_launch, type: data, label: Launches, max_length: 1000, read_only: true, no_copy: true, visible_if: "doc.package_file != null", description: "The file of the package it starts from"}
    - {name: package_activity, type: data, label: xAPI Activity, max_length: 1000, read_only: true, no_copy: true, visible_if: "doc.lesson_type == 'xAPI'", description: "The activity its statements are about (from tincan.xml)"}
    - {name: package_mastery_score, type: decimal, precision: 2, label: Mastery Score, read_only: true, no_copy: true, visible_if: "doc.lesson_type == 'SCORM'"}
    - {name: lti_tool, type: link, to: LmsLtiTool, label: LTI Tool, required_if: "doc.lesson_type == 'LTI'", visible_if: "doc.lesson_type == 'LTI'"}
    - {name: lti_target_url, type: url, label: Tool Address, visible_if: "doc.lesson_type == 'LTI'", description: "Where in the tool this lesson opens; the tool's launch address when empty"}
    - {name: lti_custom, type: text, label: Custom Parameters, max_length: 4000, visible_if: "doc.lesson_type == 'LTI'", description: "name=value, one per line, sent with the launch (besides the tool's own)"}
    - {name: duration_minutes, type: int, min: 0, max: 100000, in_list: true}
    - {name: is_preview, type: check, label: Free Preview, in_list: true, description: "Anyone may open it before enrolling (on the public page too when the course is public)"}
    - {name: required, type: check, label: Required for Completion, default: true, in_list: true}
  rules:
    - {name: quiz_lessons_only, check: "doc.lesson_type == 'Quiz' || doc.quiz == null", message: "Only quiz lessons link a quiz"}
    - {name: assignment_lessons_only, check: "doc.lesson_type == 'Assignment' || doc.assignment == null", message: "Only assignment lessons link an assignment"}
    - {name: lti_lessons_only, check: "doc.lesson_type == 'LTI' || doc.lti_tool == null", message: "Only LTI lessons open a tool"}
    - {name: package_lessons_only, check: "doc.lesson_type == 'SCORM' || doc.lesson_type == 'xAPI' || doc.package_file == null", message: "Only SCORM and xAPI lessons hold a package"}
  form:
    - {label: Lesson, fields: [title, chapter, course, position, lesson_type, duration_minutes, is_preview, required]}
    - {label: Content, fields: [content, video_url, video_embed_url, attachment, quiz, assignment, package_file, package_standard, package_launch, package_activity, package_mastery_score, lti_tool, lti_target_url, lti_custom]}
  list: {columns: [title, chapter, lesson_type, position, required], sort: position asc}

- name: LmsLearningPathCourse
  label: Learning Path Course
  kind: child
  fields:
    - {name: course, type: link, to: LmsCourse, required: true, in_list: true}
    - {name: course_title, type: data, fetch_from: course.title, read_only: true, in_list: true}

- name: LmsLearningPath
  label: Learning Path
  kind: master
  module: learn
  title_field: title
  description: "Courses to take in order. Joining a published path enrols the learner in each of its courses they may enrol in."
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: status, type: select, options: [Draft, Published, Archived], required: true, default: Draft, in_list: true, in_filter: true}
    - {name: summary, type: text, max_length: 500}
    - {name: description, type: markdown, max_length: 100000}
    - {name: courses, type: table, of: LmsLearningPathCourse, required: true}
  actions:
    - {name: join, label: Join Path, permission: read, condition: "doc.status == 'Published'"}
  list: {columns: [title, status], sort: title asc}

- name: LmsCohortInstructor
  label: Cohort Instructor
  kind: child
  fields:
    - {name: instructor, type: email, required: true, in_list: true}
    - {name: instructor_name, type: data, read_only: true, in_list: true}

- name: LmsCohortSession
  label: Live Session
  kind: child
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: starts_at, type: datetime, required: true, in_list: true}
    - {name: duration_minutes, type: int, required: true, default: 60, min: 5, max: 1440, in_list: true}
    - {name: join_url, type: url, label: Join Link, max_length: 1000, in_list: true, description: "https link of the meeting; shown to cohort members only. Empty: when the workspace has Mail, Chat and Calendar with a meeting server, the session gets a meeting of its own and members get their join link"}
    - {name: instructor, type: email, label: Host, description: "Hosts the meeting; the cohort's first instructor when empty"}
    - {name: lesson, type: link, to: LmsLesson, label: Lesson Credited, description: "A lesson of type Live in this cohort's course: learners who attend get it done"}
    - {name: credit_percent, type: int, label: Attendance Needed (%), default: 50, min: 0, max: 100, description: "Share of the session a learner must be in the meeting to count as attending (meeting attendance only)"}
    - {name: meeting, type: data, read_only: true, hidden: true, no_copy: true, max_length: 64}
    - {name: notes, type: text, max_length: 2000}

- name: LmsCohort
  label: Cohort
  kind: master
  module: learn
  title_field: title
  owner_fields: [instructors.instructor]
  description: "A group taking a course together, with dates, a capacity and live sessions. Its members are the enrolments that name it."
  fields:
    - {name: title, type: data, required: true, max_length: 200, in_list: true}
    - {name: course, type: link, to: LmsCourse, required: true, in_list: true, in_filter: true}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, required: true, in_list: true}
    - {name: time_zone, type: data, max_length: 64, description: "IANA time zone of the live sessions (e.g. Europe/Berlin); the workspace's when empty"}
    - {name: capacity, type: int, default: 0, min: 0, max: 100000, in_list: true, description: "Most learners at once (withdrawn ones do not count); 0 = no limit"}
    - {name: instructors, type: table, of: LmsCohortInstructor}
    - {name: sessions, type: table, of: LmsCohortSession, label: Live Sessions}
    - {name: description, type: markdown, max_length: 100000}
  rules:
    - {name: ends_after_start, check: "doc.end_date >= doc.start_date", message: "The end date is before the start date"}
  actions:
    - name: schedule_sessions
      label: Schedule Sessions
      permission: write
      params:
        - {name: first_date, type: date, label: First Session, required: true}
        - {name: time, type: data, label: Time, required: true, description: "HH:MM, 24-hour clock, in the cohort's time zone"}
        - {name: count, type: int, label: Sessions, description: "1 when empty, up to 100"}
        - {name: every_days, type: int, label: Every (Days), description: "7 when empty"}
        - {name: duration_minutes, type: int, label: Length (Minutes), description: "60 when empty"}
        - {name: title, type: data, label: Title, description: "Live session when empty; numbered when there are several"}
        - {name: join_url, type: data, label: Join Link, description: "An https:// link to the meeting"}
    - name: mark_attendance
      label: Mark Attendance
      permission: write
      params:
        - {name: session, type: data, label: Session, required: true, description: "The id of the live session"}
        - {name: learner, type: data, label: Learner, required: true, description: "The learner's email"}
        - {name: attended, type: check, label: Attended, description: "Yes when not given"}
        - {name: minutes, type: int, label: Minutes, description: "How long they were there, when known"}
    - name: session_attendance
      label: Session Attendance
      permission: write
      params:
        - {name: session, type: data, label: Session, required: true, description: "The id of the live session"}
  list: {columns: [title, course, start_date, end_date, capacity], sort: start_date desc}

- name: LmsLtiTool
  label: LTI Tool
  kind: master
  module: learn
  title_field: tool_name
  description: "An external learning tool lessons open by LTI 1.3. Register it in the tool with the platform addresses below; it gets its client and deployment ids here."
  fields:
    - {name: tool_name, type: data, required: true, unique: true, max_length: 140, in_list: true}
    - {name: login_url, type: url, label: Login Address, required: true, description: "The tool's OIDC login initiation address"}
    - {name: launch_url, type: url, label: Launch Address, required: true, description: "The tool's launch (target link and redirect) address"}
    - {name: redirect_uris, type: text, label: Other Redirect Addresses, max_length: 4000, description: "One per line: other addresses the tool may ask the launch to be posted to"}
    - {name: custom_parameters, type: text, max_length: 4000, description: "name=value, one per line, sent with every launch"}
    - {name: share_identity, type: check, label: Send Names and Emails, description: "The tool learns learners' names and emails; otherwise only an opaque id"}
    - {name: sends_grades, type: check, label: Sends Grades Back, description: "The tool posts scores (LTI Assignment and Grade Services): a completed activity completes the lesson. Otherwise learners mark its lessons done"}
    - {name: public_key, type: text, label: Tool Public Key, max_length: 8000, description: "The tool's RSA public key (PEM) its token requests are signed with"}
    - {name: jwks_url, type: url, label: Tool Key Set Address, description: "Or the address of the tool's keys (JWKS)"}
    - {name: client_id, type: data, read_only: true, no_copy: true, in_list: true, description: "Give the tool this client id"}
    - {name: deployment_id, type: data, read_only: true, no_copy: true, description: "And this deployment id"}
    - {name: platform_issuer, type: data, label: Issuer, read_only: true, no_copy: true, description: "Learn's issuer (Learn Settings' public URL)"}
    - {name: platform_auth_url, type: data, label: Authorization Endpoint, read_only: true, no_copy: true}
    - {name: platform_jwks_url, type: data, label: Learn's Keys (JWKS), read_only: true, no_copy: true}
    - {name: platform_token_url, type: data, label: Token Endpoint, read_only: true, no_copy: true}
  form:
    - {label: Tool, fields: [tool_name, login_url, launch_url, redirect_uris, custom_parameters, share_identity, sends_grades]}
    - {label: Grades, fields: [public_key, jwks_url]}
    - {label: Give the Tool, fields: [client_id, deployment_id, platform_issuer, platform_auth_url, platform_jwks_url, platform_token_url]}
  list: {columns: [tool_name, client_id, sends_grades], sort: tool_name asc}
